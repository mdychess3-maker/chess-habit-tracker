name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3

    - name: Set up Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Bootstrap Full Flutter Project
      run: |
        # Back up existing files
        mkdir -p temp_backup
        cp pubspec.yaml temp_backup/
        cp -r lib temp_backup/
        
        # Re-create full Flutter project structure
        flutter create --org com.example chess_habit_tracker .
        
        # Restore our custom code and dependencies
        cp temp_backup/pubspec.yaml .
        cp -r temp_backup/lib/* lib/

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChessHabitTracker-APK
        path: build/app/outputs/flutter-apk/app-release.apk
        
